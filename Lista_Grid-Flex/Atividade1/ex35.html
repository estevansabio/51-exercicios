<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
    margin: 0 auto;
    text-align: center;
    font-size: 50px;
    background-color: black;
}
.pagina{
     display: grid;

    grid-template-areas: 
    "header Cabecalho Cabecalho"
    "menu1 centro menu3"
    "rodape1 menu7 menu8";

    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 300px 300px 300px;
    gap: 10px;
}
header{
    grid-area: header;
    background-color: antiquewhite;
}
main{
    grid-area: main;
    background-color: antiquewhite;
}
footer{
    grid-area: footer;
    background-color: antiquewhite;
}
.ass{
    grid-area: rodape;
    background-color: antiquewhite;
}
.acc{
    grid-area: menu1;
    background-color: antiquewhite;
}
.centro{
    grid-area: centro;
    background-color: antiquewhite;
}
.ahh{
    grid-area: menu3;
    background-color: antiquewhite;
}
.ajj{
    grid-area: rodape1;
    background-color: antiquewhite;
}
.aii{
    grid-area: Cabecalho;
    background-color: antiquewhite;
}
.abb{
    grid-area: menu4;
    background-color: antiquewhite;
}
.azz{
    grid-area: menu5;
    background-color: antiquewhite;
}
.agg{
    grid-area: menu6;
    background-color: antiquewhite;
}
.aqq{
    grid-area: menu7;
    background-color: antiquewhite;
}
.axx{
    grid-area: menu8;
    background-color: antiquewhite;
}
</style>
<body>
    <div class="pagina">
        <header>Cabeçalho</header>
        <div class="aii">Cabecalho</div>

        <div class="acc">menu1</div>
        <div class="aqq">menu7</div>
        <div class="axx">menu8</div>

        <div class="centro">centro</div>
        <div class="ahh">menu3</div>

        <div class="ajj">rodape1</div>
    </div>
</body>
</html>
