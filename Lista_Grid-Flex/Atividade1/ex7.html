<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
    margin: 0 auto;
    text-align: center;
    font-size: 50px;
    background-color: black;
}
.pagina{
     display: grid;

    grid-template-areas: 
    "header header header header header header"
    "header header header header header header"
    "menu2 menu1 menu menu footer footer"
    "rodape rodape menu menu footer footer";

    grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
    grid-template-rows: 230px 230px 230px 230px;
    gap: 10px;
}
header{
    grid-area: header;
    background-color: antiquewhite;
}
nav{
    grid-area: menu;
    background-color: antiquewhite;
}
main{
    grid-area: menu2;
    background-color: antiquewhite;
}
footer{
    grid-area: footer;
    background-color: antiquewhite;
}   
.ass{
    grid-area: rodape;
    background-color: antiquewhite;
}
.att{
    grid-area: rodape1;
    background-color: antiquewhite;
}
.acc{
    grid-area: menu1;
    background-color: antiquewhite;
}
.aff{
    grid-area: meio;
    background-color: antiquewhite;
}
</style>
<body>
    <div class="pagina">
        <header>Cabeçalho</header>

        <nav>menu</nav>
        <div class="acc">menu1</div>

        <main>
            <div class="caixa">menu2</div>
        </main>

        <div class="ass">rodape</div>
        <footer>Rodapé</footer>
    </div>
</body>
</html>
