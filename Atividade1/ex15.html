<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
    margin: 0 auto;
    text-align: center;
    font-size: 50px;
    background-color: black;
}
.pagina{
     display: grid;

    grid-template-areas: 
    "header header header header header"
    "meio meio meio meio meio"
    "menu menu menu menu menu"
    "rodape rodape rodape rodape rodape"
    "footer footer footer footer footer";

    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    grid-template-rows: 180px 180px 180px 180px 180px;
    gap: 10px;
}
header{
    grid-area: header;
    background-color: antiquewhite;
}
nav{
    grid-area: menu;
    background-color: antiquewhite;
}
footer{
    grid-area: footer;
    background-color: antiquewhite;
}
.add{
    grid-area: cabecalho;
    background-color: antiquewhite;
}
.ass{
    grid-area: rodape;
    background-color: antiquewhite;
}
.aff{
    grid-area: meio;
    background-color: antiquewhite;
}
</style>
<body>
    <div class="pagina">
        <header>Cabeçalho</header>
        <div class="aff">meio</div>

        <nav>menu</nav>

        <div class="ass">rodape</div>
        <footer>Rodapé</footer>
    </div>
</body>
</html>
