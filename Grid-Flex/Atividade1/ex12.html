<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
    margin: 0 auto;
    text-align: center;
    font-size: 50px;
    background-color: black;
}
.pagina{
     display: grid;

    grid-template-areas: 
    "cabecalho cabecalho meio meio header header"
    "menu menu menu menu menu menu"
    "menu menu menu menu menu menu"
    "menu menu menu menu menu menu"
    "menu menu menu menu menu menu"
    "rodape rodape menu1 menu1 footer footer";

    grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
    grid-template-rows: 150px 150px 150px 150px 150px 150px;
    gap: 10px;
}
header{
    grid-area: header;
    background-color: antiquewhite;
}
nav{
    grid-area: menu;
    background-color: antiquewhite;
}
main{
    grid-area: main;
    background-color: antiquewhite;
}
footer{
    grid-area: footer;
    background-color: antiquewhite;
}
.add{
    grid-area: cabecalho;
    background-color: antiquewhite;
}
.ass{
    grid-area: rodape;
    background-color: antiquewhite;
}
.acc{
    grid-area: menu1;
    background-color: antiquewhite;
}
.aff{
    grid-area: meio;
    background-color: antiquewhite;
}
</style>
<body>
    <div class="pagina">
        <header>Cabeçalho</header>
        <div class="add">cabecalho</div>
        <div class="aff">meio</div>

        <nav>menu</nav>
        <div class="acc">menu1</div>

        <div class="ass">rodape</div>
        <footer>Rodapé</footer>
    </div>
</body>
</html>
