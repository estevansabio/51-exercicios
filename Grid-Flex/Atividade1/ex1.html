<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
    margin: 0 auto;
    text-align: center;
    font-size: 50px;
    background-color: black;
}
.pagina{
     display: grid;

    grid-template-areas: 
    "cabecalho header header"
    "menu menu main"
    "rodape footer footer";

    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 300px 300px 300px;
    gap: 10px;
}
header{
    grid-area: header;
    background-color: antiquewhite;
}
nav{
    grid-area: menu;
    background-color: antiquewhite;
}
main{
    grid-area: main;
    background-color: antiquewhite;
}
footer{
    grid-area: footer;
    background-color: antiquewhite;
}
.add{
    grid-area: cabecalho;
    background-color: antiquewhite;
}
.ass{
    grid-area: rodape;
    background-color: antiquewhite;
}
</style>
<body>
    <div class="pagina">
        <header>Cabeçalho</header>
        <div class="add">cabecalho</div>

        <nav>menu</nav>

        <main>
            <div class="caixa">1</div>
        </main>

        <div class="ass">rodape</div>
        <footer>Rodapé</footer>
    </div>
</body>
</html>
